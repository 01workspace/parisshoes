<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Paris Shoes — Everyday Sneakers, Runners & Trail Shoes</title>
    
    <style>
      /* Generated using AppDeploy UI skill */
      :root {
        --paper: #f5f3ee;
        --paper-2: #e9e7df;
        --ink: #171816;
        --muted: #77786f;
        --line: #d8d6ce;
        --tomato: #ef4b32;
        --olive: #777b54;
        --white: #fffefa;
        --font-display: 'Avenir Next', 'Segoe UI', 'Trebuchet MS', sans-serif;
        --font-body: 'Avenir Next', 'Segoe UI', sans-serif;
        --page-gutter: clamp(20px, 5vw, 76px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .announcement {
        background: var(--ink);
        color: white;
        text-align: center;
        padding: 9px;
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .header {
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--page-gutter);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 9;
      }
      .brand {
        font: 800 34px var(--font-display);
        letter-spacing: -0.09em;
      }
      .nav,
      .actions {
        display: flex;
        gap: 26px;
        align-items: center;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .nav a:hover,
      .actions a:hover {
        color: var(--tomato);
      }
      .menu {
        display: none;
      }
      .hero {
        min-height: 620px;
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 4vw;
        padding: 50px var(--page-gutter);
      }
      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-display);
        letter-spacing: -0.07em;
      }
      h1 {
        font-size: clamp(65px, 9vw, 130px);
        line-height: 0.83;
        margin: 24px 0;
      }
      .hero h1 em {
        color: var(--tomato);
        font-style: normal;
      }
      .hero p,
      .copy p {
        max-width: 350px;
        line-height: 1.7;
        color: #5f6058;
        font-size: 14px;
      }
      .btn {
        display: inline-block;
        background: var(--ink);
        color: white;
        padding: 16px 22px;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.12em;
        border: 1px solid var(--ink);
        margin-top: 18px;
      }
      .btn:hover {
        background: var(--tomato);
        border-color: var(--tomato);
      }
      .visual {
        background: #d9d7ce;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        min-height: 500px;
      }
      .visual:before {
        content: '';
        position: absolute;
        inset: 9%;
        border: 1px solid #ffffff88;
        border-radius: 50%;
        transform: scaleX(1.25);
      }
      .visual img {
        width: 100%;
        max-height: 490px;
        object-fit: contain;
        mix-blend-mode: multiply;
        filter: drop-shadow(0 25px 18px #3333);
        animation: float 5s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-12px) rotate(-4deg);
        }
      }
      .shoe-slider { position: relative; width: 100%; min-height: 500px; display: grid; place-items: center; isolation: isolate; touch-action: pan-y; user-select: none; cursor: grab; }
      .shoe-slide { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transform: translateX(8%) scale(.96); transition: opacity .65s ease, transform .75s cubic-bezier(.2,.75,.25,1); pointer-events: none; }
      .shoe-slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
      .shoe-slide img { width: 100%; max-height: 490px; object-fit: contain; mix-blend-mode: multiply; filter: drop-shadow(0 25px 18px #3333); animation: shoeFloat 5s ease-in-out infinite; }
      @keyframes shoeFloat { 50% { transform: translateY(-10px) rotate(-3deg); } }
      .shoe-caption { position: absolute; left: 22px; bottom: 22px; z-index: 2; background: var(--paper); padding: 9px 12px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      .shoe-controls { position: absolute; right: 22px; bottom: 22px; z-index: 3; display: flex; align-items: center; gap: 8px; }
      .shoe-controls button { width: 34px; height: 34px; border: 1px solid #17181666; border-radius: 50%; background: #f5f3eee8; color: var(--ink); }
      .shoe-dots { display: flex; gap: 5px; margin: 0 4px; }
      .shoe-dots button { width: 7px; height: 7px; padding: 0; border: 0; background: #17181655; }
      .shoe-dots button[aria-current="true"] { background: var(--tomato); transform: scale(1.35); }
      @media (prefers-reduced-motion: reduce) { .shoe-slide { transition: none; } .shoe-slide img { animation: none; } }
      /* Campaign homepage: immersive product motion */
      .campaign-hero {
        position: relative;
        min-height: min(790px, calc(100svh - 110px));
        overflow: hidden;
        display: grid;
        grid-template-columns: .82fr 1.18fr;
        align-items: center;
        gap: 1vw;
        padding: clamp(34px, 5vw, 76px) var(--page-gutter);
        color: #f8f5ed;
        background:
          radial-gradient(ellipse at 70% 48%, #8d4938 0%, transparent 36%),
          radial-gradient(ellipse at 15% 90%, #6a463b 0%, transparent 38%),
          linear-gradient(125deg, #1a1c1a 0%, #292a25 55%, #34312b 100%);
        isolation: isolate;
      }
      .campaign-hero:before,
      .campaign-hero:after {
        content: '';
        position: absolute;
        pointer-events: none;
        z-index: -1;
      }
      .campaign-hero:before {
        width: min(72vw, 900px);
        aspect-ratio: 1;
        border: 1px solid #ffffff18;
        border-radius: 50%;
        right: -8%;
        top: 50%;
        transform: translateY(-50%);
        box-shadow: 0 0 0 55px #ffffff08, 0 0 0 110px #ffffff05;
        animation: orbitSlow 34s linear infinite;
      }
      .campaign-hero:after {
        inset: 0;
        opacity: .13;
        background-image: radial-gradient(#fff 0.65px, transparent .65px);
        background-size: 7px 7px;
        mask-image: linear-gradient(90deg, transparent, black 55%, transparent);
      }
      @keyframes orbitSlow { to { transform: translateY(-50%) rotate(360deg); } }
      .campaign-copy {
        position: relative;
        z-index: 3;
        max-width: 510px;
        padding: 20px 0 70px;
      }
      .campaign-copy .eyebrow { color: #d7b7a8; }
      .campaign-kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
        color: #e7d9c9;
        font-size: 10px;
        letter-spacing: .2em;
        text-transform: uppercase;
        animation: riseIn .8s .1s both;
      }
      .campaign-kicker:before { content: ''; width: 28px; height: 1px; background: var(--tomato); }
      .campaign-copy h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(68px, 9vw, 138px);
        line-height: .78;
        letter-spacing: -.095em;
        animation: riseIn .9s .2s both;
      }
      .campaign-copy h1 em {
        display: inline-block;
        color: #f06a4e;
        font-style: normal;
        font-weight: 600;
        padding-left: .42em;
      }
      .campaign-copy p {
        max-width: 330px;
        margin: 30px 0 22px;
        color: #c6c2b8;
        font-size: 14px;
        line-height: 1.8;
        animation: riseIn .9s .35s both;
      }
      .campaign-cta {
        display: inline-flex;
        align-items: center;
        gap: 22px;
        padding: 15px 19px;
        color: #191a17;
        background: #f5f1e8;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .15em;
        text-transform: uppercase;
        transition: background .3s, transform .3s;
        animation: riseIn .9s .48s both;
      }
      .campaign-cta:hover { background: #f06a4e; transform: translateY(-4px); }
      .campaign-cta span { font-size: 17px; transition: transform .3s; }
      .campaign-cta:hover span { transform: translateX(5px); }
      .campaign-note {
        position: absolute;
        left: 0;
        bottom: 0;
        display: flex;
        gap: 22px;
        align-items: center;
        color: #aaa69d;
        font-size: 9px;
        letter-spacing: .16em;
        text-transform: uppercase;
        animation: riseIn 1s .6s both;
      }
      .campaign-note b { color: #f06a4e; font-weight: 500; }
      .campaign-art {
        min-width: 0;
        position: relative;
        min-height: 600px;
        display: grid;
        place-items: center;
        perspective: 1100px;
      }
      .campaign-art:before {
        content: '';
        position: absolute;
        width: min(43vw, 570px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, #e9a08035 0%, #e9a08012 48%, transparent 70%);
        animation: pulseGlow 5s ease-in-out infinite;
      }
      @keyframes pulseGlow { 50% { transform: scale(1.13); opacity: .65; } }
      .campaign-ring {
        position: absolute;
        width: min(46vw, 610px);
        aspect-ratio: 1;
        border: 1px solid #ffffff20;
        border-radius: 50%;
        transform: rotateX(68deg) rotate(-18deg);
        animation: ringDrift 12s ease-in-out infinite;
      }
      .campaign-ring:after {
        content: '';
        position: absolute;
        width: 11px;
        height: 11px;
        top: 12%;
        left: 17%;
        border-radius: 50%;
        background: #f06a4e;
        box-shadow: 0 0 22px #f06a4e;
      }
      @keyframes ringDrift { 50% { transform: rotateX(68deg) rotate(4deg) scale(1.06); } }
      .campaign-stage {
        width: 100%;
        min-height: 560px;
        position: relative;
        display: grid;
        place-items: center;
        touch-action: pan-y;
        user-select: none;
        cursor: grab;
      }
      .campaign-stage .shoe-slide {
        inset: 4% 0 8%;
        transform: translate3d(12%, 0, -80px) rotateY(-14deg) scale(.82);
        transition: opacity .8s ease, transform 1.05s cubic-bezier(.2,.8,.2,1);
      }
      .campaign-stage .shoe-slide.active {
        transform: translate3d(0, -2%, 0) rotateY(0) scale(1);
      }
      .campaign-stage .shoe-slide img {
        width: 108%;
        max-height: 530px;
        object-fit: contain;
        mix-blend-mode: normal;
        filter: drop-shadow(0 20px 15px #0006) saturate(.96) contrast(1.02);
        animation: shoeHover 6s ease-in-out infinite;
      }
      @keyframes shoeHover {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(-7deg); }
        50% { transform: translate3d(0, -18px, 0) rotate(-2deg); }
      }
      .campaign-stage .shoe-caption {
        left: 8%;
        bottom: 5%;
        color: #f8f5ed;
        background: #191a17c9;
        border: 1px solid #ffffff26;
        backdrop-filter: blur(12px);
        padding: 11px 14px;
        font-size: 9px;
        letter-spacing: .17em;
      }
      .campaign-stage .shoe-controls {
        right: 5%;
        bottom: 4%;
        gap: 10px;
      }
      .campaign-stage .shoe-controls button {
        width: 42px;
        height: 42px;
        border-color: #ffffff55;
        background: #191a17a8;
        color: #fff;
        backdrop-filter: blur(10px);
        transition: background .25s, transform .25s;
      }
      .campaign-stage .shoe-controls button:hover { background: var(--tomato); transform: scale(1.08); }
      .campaign-stage .shoe-dots button { background: #ffffff55; }
      .campaign-stage .shoe-dots button[aria-current="true"] { background: #f06a4e; }
      .campaign-index {
        position: absolute;
        right: 5%;
        top: 7%;
        color: #e9d8ca;
        font: 500 11px var(--font-body);
        letter-spacing: .2em;
      }
      .campaign-index strong { color: #f06a4e; font-size: 20px; }
      .campaign-scroll {
        position: absolute;
        right: var(--page-gutter);
        bottom: 26px;
        writing-mode: vertical-rl;
        color: #aaa69d;
        font-size: 9px;
        letter-spacing: .2em;
        text-transform: uppercase;
      }
      .motion-ticker {
        overflow: hidden;
        white-space: nowrap;
        padding: 18px 0;
        background: var(--tomato);
        color: white;
      }
      .motion-ticker-track {
        display: inline-flex;
        min-width: max-content;
        gap: 32px;
        animation: tickerTravel 28s linear infinite;
        font: 700 17px var(--font-display);
        letter-spacing: .12em;
      }
      .motion-ticker-track span:after { content: '✳'; padding-left: 32px; color: #ffd1c5; }
      @keyframes tickerTravel { to { transform: translateX(-50%); } }
      .home-featured .product,
      .home-categories .category,
      .home-story,
      .home-quote {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity .7s ease, transform .8s cubic-bezier(.2,.75,.25,1);
      }
      .home-featured.is-visible .product,
      .home-categories.is-visible .category,
      .home-story.is-visible,
      .home-quote.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .home-featured .product:nth-child(2),
      .home-categories .category:nth-child(2) { transition-delay: .12s; }
      .home-featured .product:nth-child(3),
      .home-categories .category:nth-child(3) { transition-delay: .22s; }
      .home-featured .product:nth-child(4) { transition-delay: .32s; }
      .home-categories .category:nth-child(1) { transition-delay: .04s; }
      .home-categories .category:nth-child(3) { transition-delay: .2s; }
      .home-featured .product-img img,
      .home-categories .category img { transition: transform .9s cubic-bezier(.2,.7,.2,1); }
      .home-featured .product:hover .product-img img { transform: scale(1.08) rotate(-2deg); }
      .home-categories .category:hover img { transform: scale(1.07); }
      .home-featured .product-img { background: #e4dfd4; }
      .home-categories .category { min-height: 390px; background: #d4c9bb; }
      .home-categories .category b {
        color: white;
        text-shadow: 0 2px 18px #0008;
        font-size: clamp(30px, 4vw, 48px);
      }
      .home-story {
        overflow: hidden;
        background: #e6e0d6;
      }
      .home-story img { transition: transform 1.2s ease; }
      .home-story:hover img { transform: scale(1.035); }
      .home-quote { background: #272b25; }
      .home-quote blockquote { color: #f2eee5; }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 900px) {
        .campaign-hero { grid-template-columns: 1fr 1.05fr; min-height: 650px; }
        .campaign-art, .campaign-stage { min-height: 480px; }
        .campaign-copy h1 { font-size: clamp(64px, 10vw, 100px); }
        .campaign-stage .shoe-slide img { max-height: 440px; }
      }
      @media (max-width: 640px) {
        .campaign-hero {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          min-height: 0;
          padding: 44px 18px 28px;
        }
        .campaign-copy { padding: 0 3px; }
        .campaign-copy h1 { font-size: clamp(68px, 18vw, 100px); }
        .campaign-copy p { margin: 20px 0 16px; max-width: 290px; font-size: 13px; }
        .campaign-cta { padding: 13px 16px; }
        .campaign-art { min-height: 370px; margin-top: -8px; }
        .campaign-stage { min-height: 370px; }
        .campaign-stage .shoe-slide { inset: 0 0 6%; }
        .campaign-stage .shoe-slide img { width: 115%; max-height: 340px; }
        .campaign-ring { width: 84vw; }
        .campaign-art:before { width: 78vw; }
        .campaign-stage .shoe-caption { left: 1%; bottom: 1%; font-size: 8px; }
        .campaign-stage .shoe-controls { right: 1%; bottom: 0; gap: 5px; }
        .campaign-stage .shoe-controls button { width: 34px; height: 34px; }
        .campaign-index { top: 1%; right: 2%; }
        .campaign-note { position: static; margin-top: 22px; font-size: 8px; }
        .campaign-scroll { display: none; }
        .home-categories .category { min-height: 270px; }
        .motion-ticker { padding: 14px 0; }
        .motion-ticker-track { font-size: 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .campaign-hero:before, .campaign-ring, .campaign-art:before,
        .campaign-stage .shoe-slide img, .motion-ticker-track {
          animation: none !important;
        }
        .campaign-copy > *, .home-featured .product, .home-categories .category,
        .home-story, .home-quote { animation: none !important; transition: none !important; opacity: 1; transform: none; }
      }
      .ticker {
        background: var(--tomato);
        color: white;
        padding: 15px;
        overflow: hidden;
        white-space: nowrap;
        font: 700 15px var(--font-display);
        letter-spacing: 0.1em;
      }
      .section {
        padding: 85px var(--page-gutter);
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 28px;
      }
      .head h2,
      .page-title {
        font-size: clamp(40px, 5vw, 68px);
        line-height: 0.92;
        margin: 12px 0;
      }
      .link {
        border-bottom: 1px solid;
        padding-bottom: 5px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .products {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .product-img {
        aspect-ratio: 0.82;
        background: var(--paper-2);
        position: relative;
        overflow: hidden;
      }
      .product-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: multiply;
        transition: 0.5s;
      }
      .product:hover img {
        transform: scale(1.05);
      }
      .heart {
        position: absolute;
        right: 12px;
        top: 12px;
        border: 0;
        border-radius: 50%;
        background: #fffe;
        padding: 9px;
        font-size: 18px;
      }
      .heart.on {
        color: var(--tomato);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 0;
        font-size: 12px;
      }
      .meta small {
        display: block;
        color: var(--muted);
        margin-top: 5px;
      }
      .categories {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .category {
        min-height: 340px;
        background: #d9d7ce;
        position: relative;
        display: flex;
        align-items: end;
        padding: 25px;
        overflow: hidden;
      }
      .category img {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
        object-fit: cover;
        mix-blend-mode: multiply;
      }
      .category b {
        position: relative;
        font: 700 36px var(--font-display);
      }
      .story {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #dedbd1;
      }
      .story img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        min-height: 400px;
      }
      .copy {
        padding: clamp(35px, 6vw, 90px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }
      .copy h2 {
        font-size: clamp(42px, 5vw, 70px);
        line-height: 0.9;
        margin: 20px 0;
      }
      .quote {
        background: var(--olive);
        color: white;
        text-align: center;
        padding: 95px 20px;
      }
      .quote blockquote {
        font: 600 clamp(28px, 4vw, 54px)/1.1 var(--font-display);
        max-width: 850px;
        margin: 20px auto;
      }
      .page {
        padding: 60px var(--page-gutter) 100px;
        min-height: 55vh;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 40px;
      }
      .intro p {
        max-width: 360px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .shop {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 35px;
      }
      .filters {
        border-top: 1px solid var(--line);
        padding-top: 15px;
      }
      .filters label {
        display: block;
        margin: 12px 0;
        font-size: 12px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .toolbar select,
      .form input,
      .form select {
        background: transparent;
        border: 1px solid var(--line);
        padding: 12px;
      }
      .detail {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 6vw;
        padding: 50px var(--page-gutter);
      }
      .detail > img {
        width: 100%;
        background: var(--paper-2);
        mix-blend-mode: multiply;
      }
      .detail-info {
        padding: 35px 0;
        max-width: 460px;
      }
      .detail-info h1 {
        font-size: clamp(42px, 5vw, 70px);
      }
      .detail-info p {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
      }
      .sizes {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin: 15px 0;
      }
      .size {
        padding: 13px 5px;
        background: transparent;

                        ? checkout()
                        : info(r);
        $('#app').innerHTML = header() + body + footer();
        bind();
      }
      let shoeTimer = null;
      function initShoeSlider() {
        const slider = $('#shoeSlider');
        clearInterval(shoeTimer);
        shoeTimer = null;
        if (!slider) return;
        const slides = [...slider.querySelectorAll('[data-shoe-slide]')];
        const dots = [...slider.querySelectorAll('[data-shoe-dot]')];
        const heroIndex = $('.campaign-index strong');
        const heroNote = $('.campaign-note b');
        let active = 0;
        const show = index => {
          active = (index + slides.length) % slides.length;
          slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === active);
            slide.setAttribute('aria-hidden', String(i !== active));
          });
          dots.forEach((dot, i) => dot.setAttribute('aria-current', String(i === active)));
          if (heroIndex) heroIndex.textContent = String(active + 1).padStart(2, '0');
          if (heroNote) heroNote.textContent = String(active + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
        };
        const next = () => show(active + 1);
        const previous = () => show(active - 1);
        const restart = () => {
          clearInterval(shoeTimer);
          shoeTimer = setInterval(next, 2400);
        };
        $('#shoeNext')?.addEventListener('click', () => { next(); restart(); });
        $('#shoePrev')?.addEventListener('click', () => { previous(); restart(); });
        dots.forEach((dot, i) => dot.addEventListener('click', () => { show(i); restart(); }));
        let startX = 0;
        slider.addEventListener('pointerdown', event => { startX = event.clientX; });
        slider.addEventListener('pointerup', event => {
          const delta = event.clientX - startX;
          if (Math.abs(delta) > 38) {
            if (delta < 0) next();
            else previous();
            restart();
          }
        });
        slider.addEventListener('keydown', event => {
          if (event.key === 'ArrowRight') { next(); restart(); }
          if (event.key === 'ArrowLeft') { previous(); restart(); }
        });
        slider.addEventListener('mouseenter', () => clearInterval(shoeTimer));
        slider.addEventListener('mouseleave', restart);
        slider.addEventListener('focusin', () => clearInterval(shoeTimer));
        slider.addEventListener('focusout', restart);
        restart();
      }
      function initHomeMotion() {
        const sections = document.querySelectorAll('.reveal-section');
        if (!sections.length) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
          sections.forEach(section => section.classList.add('is-visible'));
          return;
        }
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.14, rootMargin: '0px 0px -35px 0px' });
        sections.forEach(section => observer.observe(section));
      }
      function bind() {
        initShoeSlider();
        initHomeMotion();
        $('#menu')?.addEventListener('click', () => {
          menu = !menu;
          $('#nav').classList.toggle('open', menu);
        });
        document.querySelectorAll('[data-save]').forEach(b =>
          b.addEventListener('click', () => {
            let id = +b.dataset.save;
            saved = saved.includes(id)
              ? saved.filter(x => x !== id)
              : [...saved, id];
            persist();
            render();
            notice('Wishlist updated');
          })
        );
        document.querySelectorAll('[data-size]').forEach(b =>
          b.addEventListener('click', () => {
            size = +b.dataset.size;
            document
              .querySelectorAll('[data-size]')
              .forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
          })
        );
        $('#add')?.addEventListener('click', () => {
          let id = +route().split('/')[1],
            x = bag.find(x => x.id === id && x.s === size);
          x ? x.q++ : bag.push({ id, s: size, q: 1 });
          persist();
          render();
          notice('Added to your bag');
        });
        document.querySelectorAll('[data-qty]').forEach(b =>
          b.addEventListener('click', () => {
            let i = +b.dataset.qty;
            bag[i].q += +b.dataset.d;
            if (bag[i].q < 1) bag.splice(i, 1);
            persist();
            render();
          })
        );
        document.querySelectorAll('[data-remove]').forEach(b =>
          b.addEventListener('click', () => {
            bag.splice(+b.dataset.remove, 1);
            persist();
            render();
          })
        );
        document.querySelectorAll('[name=category]').forEach(b =>
          b.addEventListener('change', () => {
            category = b.value;
            location.hash =
              '/shop' + (category === 'All' ? '' : '?type=' + category);
          })
        );
        $('#sort')?.addEventListener('change', e => {
          sort = e.target.value;
          render();
        });
        $('#under')?.addEventListener('change', e => {
          let q = e.target.checked;
          $('#catalogue').innerHTML = P.filter(
            p => (category === 'All' || p.t === category) && (!q || p.p < 150)
          )
            .map(card)
            .join('');
          bind();
        });
        $('#newsletter')?.addEventListener('submit', e => {
          e.preventDefault();
          notice('Thanks for joining the Paris Shoes list');
          e.target.reset();
        });
        $('#checkout')?.addEventListener('submit', e => {
          e.preventDefault();
          if (!e.target.reportValidity()) return;
          notice('Demo order details accepted — no payment taken');
          bag = [];
          persist();
          setTimeout(() => go('home'), 1100);
        });
      }
      window.addEventListener('hashchange', () => {
        menu = false;
        render();
      });
      render();
    </script>
  </body>
</html>
